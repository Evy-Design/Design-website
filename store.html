<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Evy Diepenbroek — Store</title>
  <link rel="stylesheet" href="shared.css?v=24" />
  <link rel="stylesheet" href="test-navigation.css?v=14" />
  <link rel="stylesheet" href="projects.css?v=62" />
  <link rel="stylesheet" href="store.css?v=9" />
  <link rel="stylesheet" href="cart.css?v=6" />
  <style>body { margin: 0; }</style>
  <!-- Must load before the nav/footer injector scripts below, which
       call window.EOD_CHROME synchronously as the HTML is parsed. -->
  <script src="chrome.js?v=12"></script>
</head>
<body>

  <!-- Nav — single source of truth is chrome.js (EOD_CHROME.nav()),
       not this file. -->
  <script>document.currentScript.insertAdjacentHTML("beforebegin", EOD_CHROME.nav());</script>

  <main class="eod-page">
    <!-- Grid of products, rendered by content.js's renderStoreGrid()
         from window.EOD_CONTENT.products — add a product in Sanity,
         not here. No "Favourites" filter (Evy: "You dont have to add
         the favorite thing, because at the moment I don't have much,
         only Mockups and Motion") — just those two, plus All. -->
    <section class="eod-store">
      <div class="eod-store__inner">
        <h1 class="eod-store__heading" data-eod-reveal style="view-transition-name: eod-out-heading">Store</h1>
        <div class="eod-store__filters" data-eod-store-filters data-eod-reveal>
          <button class="eod-store__filter is-active" data-eod-store-filter="all">All</button>
          <button class="eod-store__filter" data-eod-store-filter="Mockups">Mockups</button>
          <button class="eod-store__filter" data-eod-store-filter="Motion">Motion</button>
        </div>
        <ul class="eod-store__grid"></ul>
      </div>
    </section>

  <!-- Footer — single source of truth is chrome.js (EOD_CHROME.footer()). -->
  <script>document.currentScript.insertAdjacentHTML("beforebegin", EOD_CHROME.footer());</script>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/CustomEase.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/Observer.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/ScrollTrigger.min.js"></script>
  <script src="test-navigation.js?v=14"></script>
  <script src="sanity-client.js?v=5"></script>
  <script src="content.js?v=51"></script>
  <script src="script.js?v=48"></script>
  <script src="cart.js?v=3"></script>
</body>
</html>
