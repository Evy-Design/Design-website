<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Projects — Graphic Design Portfolio | Evy Design</title>
  <!-- SEO/social meta — Evy: "make sure my website is good findable
       on google and AI models". Static (not JS-injected) so a
       crawler that doesn't execute JavaScript still sees it — most
       of this page's actual BODY content is rendered client-side
       from Sanity (see content.js), which those crawlers never run,
       but these tags are real HTML from the first byte. -->
  <meta name="description" content="A selection of independent design projects by Evy Diepenbroek, spanning editorial, branding, UX/UI and motion design." />
  <link rel="canonical" href="https://evydiepenbroek.nl/projects" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Evy Diepenbroek" />
  <meta property="og:title" content="Evy Diepenbroek — Projects" />
  <meta property="og:description" content="A selection of independent design projects by Evy Diepenbroek, spanning editorial, branding, UX/UI and motion design." />
  <meta property="og:url" content="https://evydiepenbroek.nl/projects" />
  <meta property="og:image" content="https://cdn.sanity.io/images/16akn05z/production/ebd158e7c5e1bd7a8f8cd151b669989889631725-1536x1024.png?w=1200&h=630&fit=crop" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Evy Diepenbroek — Projects" />
  <meta name="twitter:description" content="A selection of independent design projects by Evy Diepenbroek, spanning editorial, branding, UX/UI and motion design." />
  <meta name="twitter:image" content="https://cdn.sanity.io/images/16akn05z/production/ebd158e7c5e1bd7a8f8cd151b669989889631725-1536x1024.png?w=1200&h=630&fit=crop" />
  <link rel="stylesheet" href="shared.css?v=25" />
  <link rel="stylesheet" href="test-navigation.css?v=14" />
  <link rel="stylesheet" href="projects.css?v=62" />
  <link rel="stylesheet" href="cart.css?v=6" />
  <style>body { margin: 0; }</style>
  <!-- Must load before the nav/footer injector scripts below, which
       call window.EOD_CHROME synchronously as the HTML is parsed. -->
  <script src="chrome.js?v=14"></script>
</head>
<body>

  <!-- Nav — single source of truth is chrome.js (EOD_CHROME.nav()),
       not this file. -->
  <script>document.currentScript.insertAdjacentHTML("beforebegin", EOD_CHROME.nav());</script>

  <main class="eod-page">
    <!-- Grid of case studies, rendered by content.js's renderProjectsGrid()
         from window.EOD_CONTENT.projects — add a project there, not here.
         See projects.css for the hover push mechanic. -->
    <section class="eod-projects">
      <div class="eod-projects__inner">
        <!-- Heading (left) / agency-work disclaimer (right) —
             stacks on mobile (projects.css). Intro content
             (window.EOD_CONTENT.settings.projectsIntro) and the
             hidden-when-empty behaviour both come from
             renderProjectsIntro() in content.js. Sanity: Pages >
             Projects Page. -->
        <div class="eod-projects__top">
          <h1 class="eod-projects__heading" style="view-transition-name: eod-out-heading">My work</h1>
          <div class="eod-projects__intro" data-eod-reveal hidden>
            <p class="eod-projects__intro-text"></p>
            <!-- Straight (not diagonal) arrow — internal link, same
                 site (Evy: "als het gewoon naar een andere pagina is
                 op deze website dat het dan een recht horizontale
                 arrow is"), same glyph "Go back"/the slider's own
                 controls use. -->
            <a href="contact.html" class="eod-btn eod-btn--secondary eod-projects__intro-cta">
              <span class="eod-btn__secondary-viewport">
                <span class="eod-btn__secondary-track">
                  <span class="eod-btn__arrow-slot eod-btn__arrow-slot--lead" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none"><path d="M6 16H26M26 16L18 8M26 16L18 24" stroke-width="2" stroke-miterlimit="10"/></svg></span>
                  <span class="eod-btn__label">Contact me</span>
                  <span class="eod-btn__arrow-slot eod-btn__arrow-slot--trail" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none"><path d="M6 16H26M26 16L18 8M26 16L18 24" stroke-width="2" stroke-miterlimit="10"/></svg></span>
                </span>
              </span>
            </a>
          </div>
        </div>
        <ul class="eod-projects__grid"></ul>
      </div>
    </section>

  <!-- Footer — single source of truth is chrome.js (EOD_CHROME.footer()). -->
  <script>document.currentScript.insertAdjacentHTML("beforebegin", EOD_CHROME.footer());</script>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/CustomEase.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/Observer.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/ScrollTrigger.min.js"></script>
  <script src="test-navigation.js?v=14"></script>
  <script src="sanity-client.js?v=5"></script>
  <script src="content.js?v=54"></script>
  <script src="script.js?v=48"></script>
  <script src="cart.js?v=3"></script>
</body>
</html>
