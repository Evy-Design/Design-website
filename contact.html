<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Evy Diepenbroek — Contact</title>
  <!-- SEO/social meta — Evy: "make sure my website is good findable
       on google and AI models". Static (not JS-injected) so a
       crawler that doesn't execute JavaScript still sees it — most
       of this page's actual BODY content is rendered client-side
       from Sanity (see content.js), which those crawlers never run,
       but these tags are real HTML from the first byte. -->
  <meta name="description" content="Get in touch with Evy Diepenbroek, graphic and brand designer, about your next project." />
  <link rel="canonical" href="https://evydiepenbroek.nl/contact" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Evy Diepenbroek" />
  <meta property="og:title" content="Evy Diepenbroek — Contact" />
  <meta property="og:description" content="Get in touch with Evy Diepenbroek, graphic and brand designer, about your next project." />
  <meta property="og:url" content="https://evydiepenbroek.nl/contact" />
  <meta property="og:image" content="https://cdn.sanity.io/images/16akn05z/production/ebd158e7c5e1bd7a8f8cd151b669989889631725-1536x1024.png?w=1200&h=630&fit=crop" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Evy Diepenbroek — Contact" />
  <meta name="twitter:description" content="Get in touch with Evy Diepenbroek, graphic and brand designer, about your next project." />
  <meta name="twitter:image" content="https://cdn.sanity.io/images/16akn05z/production/ebd158e7c5e1bd7a8f8cd151b669989889631725-1536x1024.png?w=1200&h=630&fit=crop" />
  <link rel="stylesheet" href="shared.css?v=25" />
  <link rel="stylesheet" href="test-navigation.css?v=14" />
  <link rel="stylesheet" href="style.css?v=43" />
  <link rel="stylesheet" href="contact.css?v=1" />
  <link rel="stylesheet" href="cart.css?v=6" />
  <style>body { margin: 0; }</style>
  <!-- Must load before the nav/footer injector scripts below, which
       call window.EOD_CHROME synchronously as the HTML is parsed. -->
  <script src="chrome.js?v=14"></script>
</head>
<body>

  <!-- Nav — single source of truth is chrome.js (EOD_CHROME.nav()),
       not this file. -->
  <script>document.currentScript.insertAdjacentHTML("beforebegin", EOD_CHROME.nav());</script>

  <main class="eod-page">
    <section class="eod-contact" data-eod-contact data-eod-block="contactBlock">
      <div class="eod-contact__group">
        <p class="eod-contact__text" data-eod-word-reveal data-eod-text="contactIntro">Don&rsquo;t be a stranger, and let&rsquo;s team up. You can find me on my <a href="#" class="eod-contact__link" data-eod-reveal-text="@Evy.Design" data-eod-text="instagramUrl">Instagram</a> or <a href="#" class="eod-contact__link" data-eod-reveal-text="/in/EvyDiepenbroek" data-eod-text="linkedinUrl">LinkedIn</a> and send me a message there.</p>
      </div>
    </section>

  <!-- Footer — single source of truth is chrome.js (EOD_CHROME.footer()). -->
  <script>document.currentScript.insertAdjacentHTML("beforebegin", EOD_CHROME.footer());</script>
  </main>

  <!-- Deliberately OUTSIDE <main>: test-navigation.js applies a GSAP
       transform to <main> (needed for the slide-menu-open animation),
       and any transform on an ancestor turns position: fixed
       descendants into position: absolute-relative-to-that-ancestor
       instead of the true viewport — this banner is meant to pin to
       the actual bottom of the screen regardless of page scroll or
       the menu's own state, so it has to live outside that subtree. -->
  <div class="eod-contact__banner" data-eod-contact-banner aria-hidden="true">
    <span class="eod-contact__banner-text" data-eod-contact-banner-text></span>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/CustomEase.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/Observer.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/ScrollTrigger.min.js"></script>
  <script src="test-navigation.js?v=14"></script>
  <script src="sanity-client.js?v=5"></script>
  <script src="content.js?v=53"></script>
  <script src="script.js?v=48"></script>
  <script src="cart.js?v=3"></script>
  <script src="contact.js?v=3"></script>
</body>
</html>
